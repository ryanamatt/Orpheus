name: Test Suite

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get install -y libncurses-dev
          - os: arch-latest
            install: sudo pacman -Sy --noconfirm ncurses
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Run tests
        run: make test