name: Test Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, arch]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Ubuntu Setup ---
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # --- Arch Linux Setup ---
      - name: Run tests in Arch Linux container
        if: matrix.os == 'arch'
        uses: docker://archlinux:latest
        with:
          args: >
            sh -c "pacman -Syu --noconfirm base-devel && make test"

      # --- Ubuntu Execution ---
      - name: Run tests (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: make test