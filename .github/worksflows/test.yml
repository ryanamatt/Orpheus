name: Test Workflow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Ubuntu Setup ---
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # --- Ubuntu Execution ---
      - name: Run tests (Ubuntu)
        if: matrix.os == 'ubuntu'
        run: make test